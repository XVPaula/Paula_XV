<style>

/* ==============================
   CONFIGURACIÓN GENERAL
============================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 40%,
            #4d8db8 0%,
            #214f7b 38%,
            #102f55 68%,
            #06152e 100%
        );

}


/* ==============================
   LUCES DEL FONDO
============================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 20% 25%,
            rgba(255,255,255,.20),
            transparent 18%
        ),

        radial-gradient(
            circle at 80% 30%,
            rgba(190,240,255,.18),
            transparent 20%
        ),

        radial-gradient(
            circle at 50% 90%,
            rgba(160,230,255,.15),
            transparent 25%
        );

    z-index: 1;

}


/* ==============================
   PORTADA
============================== */

#portada {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 20;

    transition:

        opacity 1.4s ease,

        transform 1.4s ease;

}


.contenido {

    position: relative;

    z-index: 30;

    width: 90%;

    max-width: 800px;

    animation:

        aparecer 2s ease forwards;

}


@keyframes aparecer {

    from {

        opacity: 0;

        transform:
            translateY(35px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* ==============================
   INTRO
============================== */

.intro {

    margin-bottom: 25px;

    font-size:
        clamp(10px, 1.8vw, 15px);

    letter-spacing: 5px;

    text-transform: uppercase;

    text-shadow:

        0 0 8px white,

        0 0 20px #9de9ff;

}


/* ==============================
   NOMBRE
============================== */

.nombre {

    font-family:

        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:
        clamp(70px, 14vw, 135px);

    line-height: .82;

    color: white;

    text-shadow:

        0 0 10px white,

        0 0 25px #d5f8ff,

        0 0 45px #94e7ff,

        0 0 80px #54c7ff;

}


/* ==============================
   XV
============================== */

.xv {

    margin-top: 35px;

    font-size:
        clamp(22px, 4vw, 40px);

    letter-spacing: 8px;

    text-shadow:

        0 0 10px white,

        0 0 25px #a7ecff,

        0 0 45px #69d2ff;

}


/* ==============================
   FRASE
============================== */

.frase {

    margin-top: 25px;

    font-size:
        clamp(14px, 2vw, 19px);

    font-style: italic;

    line-height: 1.7;

    text-shadow:
        0 0 10px rgba(255,255,255,.8);

}


/* ==============================
   BOTÓN
============================== */

.boton {

    position: relative;

    margin-top: 40px;

    padding: 16px 40px;

    min-width: 230px;

    border:
        1px solid
        rgba(255,255,255,.9);

    border-radius: 50px;

    background:
        rgba(255,255,255,.12);

    color: white;

    font-family:
        Georgia,
        serif;

    font-size: 15px;

    letter-spacing: 3px;

    cursor: pointer;

    backdrop-filter: blur(10px);

    box-shadow:

        0 0 20px
        rgba(190,240,255,.6),

        inset 0 0 15px
        rgba(255,255,255,.08);

    transition:

        transform .4s ease,

        background .4s ease,

        box-shadow .4s ease;

}


.boton:hover {

    transform: scale(1.08);

    background:
        rgba(255,255,255,.23);

    box-shadow:

        0 0 35px
        rgba(200,245,255,.9);

}


/* ==============================
   COPOS
============================== */

.copo {

    position: fixed;

    top: -40px;

    color: white;

    pointer-events: none;

    user-select: none;

    z-index: 10;

    text-shadow:

        0 0 8px white,

        0 0 18px #a8eaff,

        0 0 30px #65ceff;

    animation:
        caer linear infinite;

}


@keyframes caer {

    0% {

        transform:
            translate3d(0,-50px,0)
            rotate(0deg);

        opacity: 0;

    }

    10% {

        opacity: .95;

    }

    50% {

        transform:
            translate3d(40px,50vh,0)
            rotate(180deg);

    }

    100% {

        transform:
            translate3d(-40px,110vh,0)
            rotate(360deg);

        opacity: .1;

    }

}


/* ==============================
   CRISTALES
============================== */

.cristal {

    position: fixed;

    width: 80px;

    height: 125px;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.55),
            rgba(150,235,255,.12),
            rgba(255,255,255,.35)
        );

    clip-path:

        polygon(
            50% 0%,
            100% 35%,
            75% 100%,
            25% 100%,
            0% 35%
        );

    opacity: .35;

    filter:

        drop-shadow(
            0 0 15px
            rgba(180,240,255,.9)
        );

    animation:
        flotar 6s ease-in-out infinite;

    z-index: 6;

}


.cristal1 {

    left: 4%;
    top: 18%;

}


.cristal2 {

    right: 4%;
    top: 22%;

    animation-delay: 1.5s;

}


.cristal3 {

    left: 9%;
    bottom: 10%;

    transform: scale(.65);

    animation-delay: 3s;

}


.cristal4 {

    right: 9%;
    bottom: 12%;

    transform: scale(.7);

    animation-delay: 2s;

}


@keyframes flotar {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(5deg);

    }

    50% {

        transform:
            translateY(-25px)
            rotate(-5deg);

    }

}


/* ==============================
   VIDEO
============================== */

#videoEscena {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding: 30px;

    background:

        radial-gradient(
            circle at center,
            #4b8eb9 0%,
            #204e79 45%,
            #102f55 75%,
            #06152e 100%
        );

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transform: scale(1.08);

    transition:

        opacity 1.5s ease,

        transform 1.5s ease;

    z-index: 30;

}


.tituloVideo {

    position: absolute;

    top: 5%;

    font-family:

        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:
        clamp(35px, 6vw, 60px);

    text-shadow:

        0 0 15px white,

        0 0 35px #8ee5ff,

        0 0 60px #54c7ff;

}


/* ==============================
   MARCO VIDEO
============================== */

.marcoVideo {

    position: relative;

    width: 92%;

    max-width: 1000px;

    padding: 10px;

    border-radius: 26px;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.95),
            rgba(150,230,255,.35),
            rgba(255,255,255,.95)
        );

    box-shadow:

        0 0 25px
        rgba(210,245,255,.95),

        0 0 70px
        rgba(100,210,255,.6);

}


#youtube {

    display: block;

    width: 100%;

    aspect-ratio: 16 / 9;

    border: none;

    border-radius: 18px;

}


/* ==============================
   PANTALLA FINAL
============================== */

#final {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 30px;

    background:

        radial-gradient(
            circle at center,
            #6faecb 0%,
            #285f88 38%,
            #123b61 70%,
            #06152e 100%
        );

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transform: scale(1.08);

    transition:

        opacity 1.5s ease,

        transform 1.5s ease;

    z-index: 40;

}


.magia {

    font-family:

        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:
        clamp(55px, 10vw, 100px);

    line-height: .9;

    text-shadow:

        0 0 15px white,

        0 0 35px #bcefff,

        0 0 70px #6bd4ff;

}


.subtituloFinal {

    margin-top: 30px;

    font-size:
        clamp(15px, 2.5vw, 21px);

    font-style: italic;

    line-height: 1.6;

}


#abrirInvitacion {

    margin-top: 40px;

    padding: 17px 42px;

    border-radius: 50px;

    border:
        1px solid
        rgba(255,255,255,.9);

    background:
        rgba(255,255,255,.16);

    color: white;

    font-family:
        Georgia,
        serif;

    font-size: 15px;

    letter-spacing: 3px;

    cursor: pointer;

    box-shadow:
        0 0 25px
        rgba(200,240,255,.7);

    backdrop-filter:
        blur(10px);

    transition:
        transform .4s ease,
        background .4s ease;

}


#abrirInvitacion:hover {

    transform: scale(1.08);

    background:
        rgba(255,255,255,.28);

}


/* ==============================
   TRANSICIÓN
============================== */

#transicion {

    position: fixed;

    inset: 0;

    z-index: 100;

    pointer-events: none;

    opacity: 0;

    background:

        radial-gradient(
            circle,
            white 0%,
            #e9fbff 15%,
            #b7efff 30%,
            #69cdec 50%,
            #24679a 75%,
            #06152e 100%
        );

    transition:
        opacity 1.2s ease;

}


/* ==============================
   ESTADOS
============================== */

body.mostrarVideo #portada {

    opacity: 0;

    transform: scale(.92);

    pointer-events: none;

}


body.mostrarVideo #videoEscena {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transform: scale(1);

}


body.mostrarFinal #videoEscena {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

}


body.mostrarFinal #final {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transform: scale(1);

}


/* ==============================
   CELULAR
============================== */

@media (max-width: 600px) {

        font-size: 72px;

        font-size: 38px;

    }

    .magia {

        font-size: 65px;

    }

    .cristal {

        width: 50px;

        height: 80px;

    }

}

</style>

</head>

<script>

/* =====================================================
   ENLACE DE TU INVITACIÓN
===================================================== */

const ENLACE_INVITACION =
    "https://xn--olympusdiseos-skb.my.canva.site/xv-paula-villegas";



/* =====================================================
   BOTONES
===================================================== */

const botonComenzar =
    document.getElementById(

    );


const botonInvitacion =

    );


const transicion =

    );



/* =====================================================

botonComenzar.addEventListener(

    function() {

const youtubeAPI =

);



/* =====================================================
   CUANDO YOUTUBE CARGUE

            events: {

                onStateChange:
                    detectarFinalVideo

            }

        }
    );

};



/* =====================================================
   DETECTAR CUANDO TERMINA EL VIDEO
===================================================== */

function detectarFinalVideo(event) {

    if (event.data === 0) {

        mostrarInvitacion();

    }

}



/* =====================================================
   MOSTRAR PANTALLA FINAL
===================================================== */

function mostrarInvitacion() {

    transicion.style.opacity =
        "1";


    setTimeout(
        function() {

            document.body.classList.remove(
                "mostrarVideo"
            );


            document.body.classList.add(
                "mostrarFinal"
            );


            setTimeout(
                function() {

                    transicion.style.opacity =
                        "0";

                },
                900
            );

        },
        1200
    );

}



/* =====================================================
   BOTÓN ABRIR INVITACIÓN
===================================================== */

botonInvitacion.addEventListener(
    "click",
    function() {

        window.location.href =
            ENLACE_INVITACION;

);
